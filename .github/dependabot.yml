version: 2
updates:
- package-ecosystem: npm
  directory: "/canaries"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  versioning-strategy: increase
  groups:
    npm-canaries:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/trivia-backend/app"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  versioning-strategy: increase
