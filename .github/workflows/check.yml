on: [pull_request, push]

name: Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipelines:
    name: Pipelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Test
        run: |
          cd pipelines

          npm install -g aws-cdk
          npm ci

          npm run build
          npm run synth-static-site-pipeline
          npm run synth-backend-pipeline
          npm run synth-backend-blue-green-pipeline
          npm run synth-backend-base-image-pipeline
          npm run synth-chat-bot-pipeline
          npm run synth-canaries-pipeline
          npm run synth-pipelines-bootstrap

  static-site:
    name: Static Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Test
        run: |
          npm install -g aws-cdk

          cd static-site/cdk
          npm ci
          npm run build

          cd ../app
          npm ci
          npm run build
          npm run build:dev
          npm run build:test
          npm run build:prod

  game-infra:
    name: Game Infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Test
        run: |
          npm install -g aws-cdk

          cd trivia-backend/cdk
          npm ci
          npm run build

  game-app:
    name: Game App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Pull base images
        # public.ecr.aws rate-limits anonymous pulls from shared runner IPs
        # (429 toomanyrequests), so retry pulling the FROM images before building.
        # docker build then uses the local copies instead of pulling again.
        run: |
          for image in $(awk 'toupper($1) == "FROM" {print $2}' trivia-backend/base/Dockerfile | sort -u); do
            for attempt in 1 2 3 4 5; do
              docker pull "$image" && continue 2
              echo "Pull of $image failed (attempt $attempt of 5)"
              [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
            done
            exit 1
          done
      - name: Test
        run: |
          cd trivia-backend/base
          docker build -t reinvent-trivia-backend-base:release .

          cd ..
          docker build -t reinvent-trivia-backend:release .
